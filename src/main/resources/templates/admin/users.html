<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - BookVerse Admin</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin/admin.css">
   <style>
    .users-container {
        background: white;
        border-radius: 24px;
        padding: 24px;
        box-shadow: var(--shadow-sm);
    }
    .users-table {
        width: 100%;
        border-collapse: collapse;
    }
    .users-table th {
        text-align: left;
        padding: 14px 12px;
        background: var(--primary);
        color: white;
        font-weight: 600;
    }
    .users-table td {
        padding: 12px;
        border-bottom: 1px solid #e2e8f0;
        vertical-align: middle;
    }
    .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
    }
    .badge-admin {
        background: var(--accent);
        color: white;
    }
    .badge-user {
        background: #94a3b8;
        color: white;
    }
    .role-select {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 0.85rem;
    }
    .update-form {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .btn-update {
        background: var(--accent);
        color: white;
        border: none;
        padding: 6px 18px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: 0.2s;
        white-space: nowrap;
    }
    .btn-update:hover {
        background: var(--accent-dark);
        transform: scale(1.02);
    }
    .action-cell {
        width: 180px;
    }
    .note {
        font-size: 0.8rem;
        color: var(--text-light);
        margin-top: 20px;
        text-align: center;
        padding: 12px;
        background: #f8f9fa;
        border-radius: 12px;
    }
</style>
</head>
<body>

<div class="admin-layout">
    <!-- Side Navbar -->
    <nav class="admin-sidenav">
        <div class="admin-sidenav-logo">
            <a href="/"><span>📚 BookVerse</span></a>
            <p>Admin Panel</p>
        </div>
        <div class="admin-nav-items">
            <a href="/admin/inventory" class="admin-nav-item">
                <span class="nav-icon">📚</span> Inventory
            </a>
            <a href="/admin/users" class="admin-nav-item active">
                <span class="nav-icon">👥</span> Users
            </a>
            <a href="/" class="admin-nav-item">
                <span class="nav-icon">🌐</span> View Store
            </a>
        </div>
        <div class="admin-sidenav-footer">
            <button class="admin-logout-btn" onclick="showLogoutModal()">
                <span class="nav-icon">🚪</span> Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="admin-content">
        <div class="users-container">
            <h1 style="color: var(--primary); margin-bottom: 24px;">Manage Users</h1>
            
            <table class="users-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Change Role</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user, stat : ${users}">
                        <td th:text="${stat.count}"></td>
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span th:if="${user.role == 'ADMIN'}" class="badge badge-admin">ADMIN</span>
                            <span th:if="${user.role != 'ADMIN'}" class="badge badge-user" th:text="${user.role}">USER</span>
                        </td>
                        <td class="action-cell">
                            <form method="post" th:action="@{/admin/users/update-role}" class="update-form">
                                <input type="hidden" name="userId" th:value="${user.id}">
                                <select name="role" class="role-select">
                                    <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                                    <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                                </select>
                                <button type="submit" class="btn-update">Update</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="note">
                ⚠️ Note: You cannot change your own role to prevent losing admin access.
            </div>
        </div>
    </div>
</div>

<!-- Logout Modal -->
<div id="logoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; padding:40px; border-radius:16px; text-align:center; max-width:400px; width:90%;">
        <h3 style="margin-bottom:10px; color:var(--primary);">Leaving so soon?</h3>
        <p style="color:var(--text-light); margin-bottom:30px;">Are you sure you want to log out?</p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <button onclick="hideLogoutModal()" style="padding:10px 24px; border-radius:8px; border:1px solid #ddd; background:white; cursor:pointer; font-weight:600;">Cancel</button>
            <a href="/logout" style="padding:10px 24px; border-radius:8px; background:var(--accent); color:white; text-decoration:none; font-weight:600;">Logout</a>
        </div>
    </div>
</div>

<script>
function showLogoutModal() {
    document.getElementById('logoutModal').style.display = 'flex';
}
function hideLogoutModal() {
    document.getElementById('logoutModal').style.display = 'none';
}
</script>

</body>
</html>
