<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin • Add Book</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            background: var(--bg-light);
        }

        .admin-container {
            max-width: 900px;
            margin: 60px auto;
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            padding: 40px;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 2rem;
            color: var(--primary);
        }

        .admin-header p {
            color: var(--text-light);
            margin-top: 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, select, textarea {
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid #ddd;
            font-size: 0.95rem;
            font-family: var(--font-body);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13,92,99,0.15);
        }

        .cover-preview {
            margin-top: 10px;
            width: 140px;
            height: 210px;
            border-radius: var(--radius-md);
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--text-light);
            background: #fafafa;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-cancel {
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
        }

        .btn-submit {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .future-note {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px dashed #ddd;
            padding-top: 15px;
        }
    </style>
</head>

<body>

<div class="admin-container">

    <div class="admin-header">
        <h1>Add New Book</h1>
        <p>Fill the details below to publish a book in your store</p>
    </div>

    <!--
        Later: change action="/admin/save-book"
        and method="post"
    -->
    <form id="addBookForm" th:action="@{/admin/saveBook}" method="post">

        <div class="form-grid">

            <!-- Book Title -->
            <div class="form-group full">
                <label>Book Title</label>
                <input type="text" name="title" placeholder="Enter book title">
                <!-- later binds to BookEntity.title -->
            </div>

            <!-- Author -->
            <div class="form-group">
                <label>Author</label>
                <input type="text" name="author" placeholder="Author name">
                <!-- later binds to BookEntity.author -->
            </div>

            <!-- Genre -->
            <div class="form-group">
                <label>Genre</label>
                <select name="genre">
                    <option>Biography</option>
                    <option>Buisness</option>
                    <option>Comics</option>
                    <option>Computers</option>
                    <option>Cooking</option>
                    <option>Fiction</option>
                    <option>Games</option>
                    <option>History</option>
                    <option>Juvenile Fiction</option>
                    <option>Medical</option>
                    <option>Nature</option>
                    <option>Psycology</option>
                    <option>Self-Help</option>
                    <option>Social Science</option>
                </select>
                <!-- later binds to BookEntity.genre -->
            </div>

            <!-- Price -->
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" step="0.01" placeholder="499">
                <!-- later binds to BookEntity.price -->
            </div>

            <!-- Cover Image Path -->
            <div class="form-group">
                <label>Cover Image Path</label>
                <input type="text" name="imageUrl" placeholder="/images/book.jpg">
                <!-- later binds to BookEntity.imageUrl -->
            </div>

            <!-- Description -->
            <div class="form-group full">
                <label>Description</label>
                <textarea name="description" placeholder="Short book summary..."></textarea>
                <!-- future field: BookEntity.description -->
            </div>
            
            <!-- ISBN -->
			<div class="form-group">
			    <label>ISBN</label>
			    <input type="text" name="isbn" placeholder="978-93-123456-78-9">
			    <!-- later binds to BookEntity.isbn -->
			</div>
	
			<!-- Publisher -->
			<div class="form-group">
			    <label>Publisher</label>
			    <input type="text" name="publisher" placeholder="Penguin Random House">
			    <!-- later binds to BookEntity.publisher -->
			</div>
	
			<!-- Published Year -->
			<div class="form-group">
			    <label>Published Year</label>
			    <input type="number" name="publishedYear" placeholder="2024">
			    <!-- later binds to BookEntity.publishedYear -->
			</div>
	
			<!-- Stock Quantity -->
			<div class="form-group">
			    <label>Stock Quantity</label>
			    <input type="number" name="stock" min="0" placeholder="50">
			    <!-- later binds to BookEntity.stock -->
			</div>
	
			<!-- Visibility -->
			<div class="form-group">
			    <label>
			        <input type="checkbox" name="active" value="true" checked>
			        Active (Visible in Store)
			    </label>
			    <!-- later binds to BookEntity.active -->
			</div>
        </div>

        <div class="actions">
            <button type="button" class="btn-cancel" onclick="history.back()">Cancel</button>
            <button type="submit" class="btn-submit">Add Book</button>
        </div>


    </form>

</div>

</body>
</html>
