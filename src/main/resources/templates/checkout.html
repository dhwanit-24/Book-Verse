<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BookVerse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .checkout-page { padding: 120px 0 60px; background: var(--bg-light); min-height: 100vh; }
        .checkout-title { font-family: var(--font-display); font-size: 2rem; color: var(--primary); margin-bottom: 32px; }
        .checkout-layout { display: grid; grid-template-columns: 1fr 380px; gap: 32px; align-items: start; }
        .checkout-form { background: white; border-radius: 28px; padding: 32px; box-shadow: var(--shadow-sm); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-dark); }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: var(--font-body); transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,107,91,0.1); }
        .payment-options { display: flex; gap: 20px; margin: 20px 0; }
        .payment-option { flex: 1; padding: 16px; border: 2px solid #e2e8f0; border-radius: 16px; text-align: center; cursor: pointer; transition: 0.2s; }
        .payment-option.selected { border-color: var(--accent); background: #fff5f3; }
        .card-details { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .order-summary { background: white; border-radius: 28px; padding: 28px; box-shadow: var(--shadow-sm); position: sticky; top: 100px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .summary-total { font-size: 1.2rem; font-weight: 800; color: var(--primary); border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: 16px; }
        .place-order-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 40px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .place-order-btn:hover { background: var(--accent-dark); transform: translateY(-2px); }
        .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
        .spinner { background: white; padding: 30px; border-radius: 20px; text-align: center; }
        @media (max-width: 768px) { .checkout-layout { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- Header same as before (omitted for brevity, copy from previous checkout.html) -->
    <header class="header">...</header>

    <main class="checkout-page">
        <div class="container">
            <h1 class="checkout-title">Checkout</h1>
            <div class="checkout-layout">
                <!-- Form -->
                <form id="checkoutForm" method="post" th:action="@{/place-order}">
                    <!-- Address Fields -->
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" name="phoneNumber" required pattern="[0-9]{10}" title="10-digit mobile number">
                    </div>
                    <div class="form-group">
                        <label>Address Line 1 *</label>
                        <input type="text" name="addressLine1" required>
                    </div>
                    <div class="form-group">
                        <label>Address Line 2 (Optional)</label>
                        <input type="text" name="addressLine2">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City *</label>
                            <input type="text" name="city" required>
                        </div>
                        <div class="form-group">
                            <label>State *</label>
                            <input type="text" name="state" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pincode *</label>
                            <input type="text" name="pincode" required pattern="[0-9]{6}" title="6-digit pincode">
                        </div>
                        <div class="form-group">
                            <label>Landmark (Optional)</label>
                            <input type="text" name="landmark">
                        </div>
                    </div>

                    <!-- Payment Options -->
                    <div class="payment-options">
                        <div class="payment-option" data-method="COD" onclick="selectPayment('COD')">
                            💵 Cash on Delivery
                        </div>
                        <div class="payment-option" data-method="CARD" onclick="selectPayment('CARD')">
                            💳 Credit/Debit Card
                        </div>
                    </div>
                    <input type="hidden" name="paymentMethod" id="selectedPaymentMethod" value="COD">

                    <!-- Card Details (hidden initially) -->
                    <div id="cardDetails" class="card-details">
                        <div class="form-group">
                            <label>Card Number</label>
                            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Card Holder Name</label>
                                <input type="text" id="cardHolder">
                            </div>
                            <div class="form-group">
                                <label>Expiry Date</label>
                                <input type="text" placeholder="MM/YY" id="expiry">
                            </div>
                            <div class="form-group">
                                <label>CVV</label>
                                <input type="password" maxlength="3" id="cvv">
                            </div>
                        </div>
                    </div>

                    <button type="button" class="place-order-btn" onclick="processOrder()">Place Order</button>
                </form>

                <!-- Order Summary -->
                <aside class="order-summary">
                    <h3>Order Summary</h3>
                    <div th:each="item : ${cart}" class="summary-item">
                        <span th:text="${item.title} + ' x ' + ${item.quantity}"></span>
                        <span>₹ <span th:text="${item.price * item.quantity}"></span></span>
                    </div>
                    <div class="summary-item"><span>Subtotal</span><span>₹ <span th:text="${subtotal}"></span></span></div>
                    <div class="summary-item"><span>Shipping</span><span th:text="${shipping == 0} ? 'FREE' : '₹ 40'"></span></div>
                    <div class="summary-total"><span>Total</span><span>₹ <span th:text="${total}"></span></span></div>
                </aside>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner">
            <div>⏳ Processing your order...</div>
            <div style="margin-top: 10px;">Please do not refresh the page.</div>
        </div>
    </div>

    <script>
        function selectPayment(method) {
            document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
            document.querySelector(`.payment-option[data-method="${method}"]`).classList.add('selected');
            document.getElementById('selectedPaymentMethod').value = method;
            const cardDiv = document.getElementById('cardDetails');
            if (method === 'CARD') {
                cardDiv.style.display = 'block';
            } else {
                cardDiv.style.display = 'none';
            }
        }

        function validateCardDetails() {
            const cardNum = document.getElementById('cardNumber').value.replace(/\s/g, '');
            const holder = document.getElementById('cardHolder').value;
            const expiry = document.getElementById('expiry').value;
            const cvv = document.getElementById('cvv').value;
            if (!cardNum.match(/^\d{16}$/)) { alert('Invalid card number (16 digits)'); return false; }
            if (!holder.trim()) { alert('Card holder name required'); return false; }
            if (!expiry.match(/^(0[1-9]|1[0-2])\/\d{2}$/)) { alert('Expiry must be MM/YY'); return false; }
            if (!cvv.match(/^\d{3,4}$/)) { alert('CVV must be 3-4 digits'); return false; }
            return true;
        }

        function processOrder() {
            const paymentMethod = document.getElementById('selectedPaymentMethod').value;
            // Basic address validation (HTML required already covers)
            if (paymentMethod === 'CARD') {
                if (!validateCardDetails()) return;
                // Show loading overlay for 5-7 seconds
                const overlay = document.getElementById('loadingOverlay');
                overlay.style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('checkoutForm').submit();
                }, 5000 + Math.random() * 2000);
            } else if (paymentMethod === 'COD') {
                if (confirm('Confirm Cash on Delivery? You will pay when the order is delivered.')) {
                    document.getElementById('checkoutForm').submit();
                }
            }
        }
    </script>
</body>
</html>
